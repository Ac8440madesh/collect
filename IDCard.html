<!DOCTYPE html>
<!-- Student ID: YOUR_STUDENT_ID -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YOUR_STUDENT_ID</title>
  <!-- Link the external stylesheet -->
  <link rel="stylesheet" href="IDCard_styles.css">
</head>
<body>
  <!-- Outer card container -->
  <div class="id-card">

    <!-- Header section: institution name -->
    <header class="card-header">
      <h1>Student Identity Card</h1>
    </header>

    <!-- Main section: photo + details -->
    <main class="card-body">
      <!-- Photograph placeholder -->
      <section class="photo-section">
        <img id="photo" src="https://via.placeholder.com/150x180?text=Photo" alt="Student photograph">
      </section>

      <!-- Student details -->
      <section class="details-section">
        <h2 id="student-name">Your Full Name</h2>
        <p><span class="label">Department:</span> Computer Science</p>
        <p><span class="label">Date of Birth:</span> 01/01/2000</p>
        <p><span class="label">Mobile:</span> 9876543210</p>
        <p><span class="label">Email:</span> name@example.com</p>
        <p><span class="label">Address:</span> Hyderabad, Telangana, India</p>
      </section>
    </main>

    <!-- Footer section -->
    <footer class="card-footer">
      <p>ID: YOUR_STUDENT_ID</p>
    </footer>
  </div>
</body>
</html>
